name: SportXP Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality_and_analysis:
    name: Code Quality & Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Cài đặt Flutter SDK (kèm cache)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.7'
          cache: true

      # 3. Tải packages dependencies
      - name: Install dependencies
        run: flutter pub get

      # 4. Phân tích tĩnh (bắt syntax error, unused imports, linter errors, dead code)
      - name: Analyze code
        run: flutter analyze

  build:
    name: Build Android & Web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality_and_analysis
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      # Debug build validates Android plugins/resources without release signing secrets.
      - name: Build Android APK
        run: flutter build apk --debug
      - name: Build web release
        run: flutter build web --release --no-wasm-dry-run
