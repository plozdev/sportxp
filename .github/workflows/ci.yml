name: SportXP Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality_and_tests:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Cài đặt Flutter SDK (kèm cache)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.7'
          cache: true

      # 3. Tải packages dependencies
      - name: Install dependencies
        run: flutter pub get

      # 4. Phân tích tĩnh (bắt unused imports, linter errors, dead code)
      - name: Analyze code
        run: flutter analyze

      # Run every test; do not skip accessibility failures in headless CI.
      - name: Run automated tests
        run: flutter test

      # Reproduce runners where optional SDK font files are not installed.
      - name: Verify onboarding and passport with fallback fonts
        run: flutter test --dart-define=TEST_SDK_FONTS=false test/onboarding/onboarding_test.dart test/social_visual_test.dart
