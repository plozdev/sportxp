name: SportXP Flutter CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality_and_tests:
    name: Analyze & Runtime Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Cài đặt Flutter SDK (kèm cache)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.7'
          cache: true

      # 3. Tải packages dependencies
      - name: Install dependencies
        run: flutter pub get

      # 4. Phân tích tĩnh (bắt unused imports, linter errors, dead code)
      - name: Analyze code
        run: flutter analyze

      # Validate behavior and runtime exceptions, not demo names or screenshot pixels.
      - name: Run behavior and runtime regression tests
        run: flutter test

      # Reproduce runners where optional SDK font files are not installed.
      - name: Verify onboarding and passport with fallback fonts
        run: flutter test --dart-define=TEST_SDK_FONTS=false test/onboarding/onboarding_test.dart test/social_visual_test.dart

  build:
    name: Build Android & Web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      # Debug build validates Android plugins/resources without release signing secrets.
      - name: Build Android APK
        run: flutter build apk --debug
      - name: Build web release
        run: flutter build web --release --no-wasm-dry-run
